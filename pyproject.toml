[project]
name = "pdm"
version = "0.1.0"
description = "Predictive Maintenance (AI4I 2020) - Machine failure and failure-mode prediction service"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "joblib>=1.4.2",
    "lightgbm>=4.5.0",
    "numpy>=2.1.0",
    "pandas>=2.2.3",
    "pydantic>=2.10.0",
    "scikit-learn>=1.6.0",
    "uvicorn[standard]>=0.32.0",
    "xgboost-cpu>=2.1.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "ipykernel>=6.29.5",
    "matplotlib>=3.10.0",
    "mypy>=1.14.0",
    "pandas-stubs>=2.2.3",
    "pandera>=0.22.1",
    "papermill>=2.6.0",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "requests>=2.32.3",
    "ruff>=0.9.0",
    "seaborn>=0.13.2",
    "types-requests>=2.32.0",
    "ucimlrepo>=0.0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdm"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.13"
files = ["src", "train.py", "predict.py", "predict_test.py", "scripts"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["pdm.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/pdm", "predict"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
